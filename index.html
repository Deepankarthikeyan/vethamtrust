  <style>
    .sigma_preloader { transition: opacity 0.4s ease, visibility 0.4s ease; }
    .sigma_top.visible { opacity: 1; visibility: visible; }
    .sigma_aside.open { transform: translateX(0); }
    .sigma_aside-overlay.open { opacity: 1; visibility: visible; }
    .sigma_search-form-wrapper.open { opacity: 1; visibility: visible; }
    .sigma_header.can-sticky.is-sticky { position: fixed; top: 0; left: 0; right: 0; z-index: 999; animation: slideDown 0.35s ease; box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
    @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
    .aside-toggler button { background: none; border: none; padding: 0; cursor: pointer; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
    .portfolio-trigger { background: none; border: none; cursor: pointer; }
    .portfolio-trigger.active { color: var(--mht-accent); }
    button.kr-nav, button.kr-dot { font: inherit; }
